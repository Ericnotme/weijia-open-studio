<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="星集卡牌店：原创 3D 卡牌店经营游戏。进货、售卖、开包收藏，经营你的小小卡牌宇宙。"><title>星集卡牌店 · Starhaven</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23102b3d'/%3E%3Cpath d='M20 6l4 10 10 4-10 4-4 10-4-10-10-4 10-4z' fill='%23c6ed9c'/%3E%3C/svg%3E"><style>/*STYLE*/</style></head><body>
